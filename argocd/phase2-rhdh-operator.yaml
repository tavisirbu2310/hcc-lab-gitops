apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: phase2-rhdh-operator
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/tavisirbu2310/hcc-lab-gitops
    targetRevision: main
    path: phase2-rhdh-operator
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true