apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1
  db:
    vendor: postgres
    host: postgres.keycloak.svc
    port: 5432
    database: keycloak
    usernameSecret: {name: keycloak-db-secret, key: username}
    passwordSecret: {name: keycloak-db-secret, key: password}
  hostname:
    hostname: keycloak.apps.hcc.test-lab.click
  http:
    httpEnabled: false
    tlsSecret: keycloak-tls
  proxy:
    headers: xforwarded
  ingress:
    enabled: false