apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: keycloak
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRESQL_DATABASE, value: keycloak}
            - name: POSTGRESQL_USER
              valueFrom: {secretKeyRef: {name: keycloak-db-secret, key: username}}
            - name: POSTGRESQL_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-db-secret, key: password}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/pgsql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: keycloak
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]